<script>


/* =========================

const songs = [

    }

];


let currentSong = 0;

let audio = new Audio();


/* =========================
   LOAD SONG
   ========================= */

function loadSong(index) {

    currentSong = index;

    audio.src = songs[index].audio;

    document.getElementById("songTitle").innerText =
        songs[index].title;

    document.getElementById("artist").innerText =
        songs[index].artist;

    document.getElementById("album").src =
        songs[index].image;

    audio.load();

}


/* =========================
   PLAY / PAUSE
   ========================= */

function playPause() {

    if (audio.paused) {

        audio.play();

        document.getElementById("playButton")
            .innerText = "⏸";

    }

    else {

        audio.pause();

        document.getElementById("playButton")
            .innerText = "▶";

    }

}


/* =========================
   SELECT SONG
   ========================= */

function selectSong(index) {

    loadSong(index);

    audio.play();

    document.getElementById("playButton")
        .innerText = "⏸";

}


/* =========================
   NEXT
   ========================= */

function nextSong() {

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    loadSong(currentSong);

    audio.play();

    document.getElementById("playButton")
        .innerText = "⏸";

}


/* =========================
   PREVIOUS
   ========================= */

function previousSong() {

    currentSong--;

    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }

    loadSong(currentSong);

    audio.play();

    document.getElementById("playButton")
        .innerText = "⏸";

}


/* =========================
   TIME FORMAT
   ========================= */

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    let minutes = Math.floor(seconds / 60);

    let secs = Math.floor(seconds % 60);

    if (secs < 10) {
        secs = "0" + secs;
    }

    return minutes + ":" + secs;

}


/* =========================
   PROGRESS
   ========================= */

audio.addEventListener("timeupdate", function() {

    if (audio.duration) {

        let progress =
            (audio.currentTime / audio.duration) * 100;

        document.getElementById("progress").value =
            progress;

        document.getElementById("currentTime")
            .innerText =
            formatTime(audio.currentTime);

        document.getElementById("duration")
            .innerText =
            formatTime(audio.duration);

    }

});


document.getElementById("progress")
    .addEventListener("input", function() {

        if (audio.duration) {

            audio.currentTime =
                (this.value / 100) * audio.duration;

        }

    });


/* =========================
   VOLUME
   ========================= */

document.getElementById("volume")
    .addEventListener("input", function() {

        audio.volume = this.value;

    });


/* =========================
   AUTOMATIC NEXT
   ========================= */

audio.addEventListener("ended", function() {

    nextSong();

});


/* =========================
   CREATE SONG CARDS
   ========================= */

function showCards(songArray = songs) {

    const cards =
        document.getElementById("cards");

    cards.innerHTML = "";

    songArray.slice(0, 6).forEach(function(song) {

        const index = songs.indexOf(song);

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <img src="${song.image}">

            <div class="card-title">
                ${song.title}
            </div>

            <div class="card-artist">
                ${song.artist}
            </div>

        `;

        card.onclick = function() {

            selectSong(index);

        };

        cards.appendChild(card);

    });

}


/* =========================
   SONG LIST
   ========================= */

function showSongs(songArray = songs) {

    const container =
        document.getElementById("songList");

    container.innerHTML = "";

    songArray.forEach(function(song) {

        const index = songs.indexOf(song);

        const element =
            document.createElement("div");

        element.className = "song";

        element.innerHTML = `

            <div class="song-number">
                ${index + 1}
            </div>

            <div class="song-info">

                <div class="song-name">
                    ${song.title}
                </div>

                <div class="song-artist">
                    ${song.artist}
                </div>

            </div>

            <button
                class="add-button"
                onclick="event.stopPropagation();
                addToPlaylist(${index})"
            >
                ＋
            </button>

        `;

        element.onclick = function() {

            selectSong(index);

        };

        container.appendChild(element);

    });

}


/* =========================
   SEARCH
   ========================= */

function searchSongs(text) {

    text = text.toLowerCase();

    const filtered =
        songs.filter(function(song) {

            return song.title
                .toLowerCase()
                .includes(text);

        });

    showCards(filtered);
    showSongs(filtered);

}


/* =========================
   PLAYLIST SYSTEM
   ========================= */

let playlists =
    JSON.parse(localStorage.getItem("playlists")) || {};


function createPlaylist() {

    let name =
        prompt("Enter playlist name:");

    if (!name || name.trim() === "") {
        return;
    }

    name = name.trim();

    if (playlists[name]) {

        alert("That playlist already exists!");

        return;

    }

    playlists[name] = [];

    savePlaylists();

    showPlaylists();

}


function savePlaylists() {

    localStorage.setItem(
        "playlists",
        JSON.stringify(playlists)
    );

}


function showPlaylists() {

    const container =
        document.getElementById("playlists");

    container.innerHTML = "";

    for (let name in playlists) {

        let playlist =
            document.createElement("div");

        playlist.className = "playlist";

        playlist.innerHTML = `
            📁 ${name}
            <span>
                ${playlists[name].length}
            </span>
        `;

        playlist.onclick = function() {

            openPlaylist(name);

        };

        container.appendChild(playlist);

    }

}


/* =========================
   OPEN PLAYLIST
   ========================= */

function openPlaylist(name) {

    const container =
        document.getElementById("songList");

    container.innerHTML = "";

    const title =
        document.createElement("h2");

    title.innerText =
        "📁 " + name;

    container.appendChild(title);


    playlists[name].forEach(function(songIndex) {

        const song =
            document.createElement("div");

        song.className =
            "playlist-song";

        song.innerHTML = `

            <span>
                🎵 ${songs[songIndex].title}
            </span>

            <button
                onclick="selectSong(${songIndex})"
            >
                ▶
            </button>

            <button
                onclick="removeFromPlaylist(
                    '${name}',
                    ${songIndex}
                )"
            >
                🗑
            </button>

        `;

        container.appendChild(song);

    });

}


/* =========================
   REMOVE FROM PLAYLIST
   ========================= */

function removeFromPlaylist(
    name,
    songIndex
) {

    playlists[name] =
        playlists[name].filter(
            index => index !== songIndex
        );

    savePlaylists();

    openPlaylist(name);

}


/* =========================
   ADD TO PLAYLIST
   ========================= */

function addToPlaylist(songIndex) {

    let names =
        Object.keys(playlists);

    if (names.length === 0) {

        alert("Create a playlist first!");

        return;

    }

    let choice =
        prompt(
            "Add \"" +
            songs[songIndex].title +
            "\" to which playlist?\n\n" +
            names.join("\n")
        );

    if (!choice) {
        return;
    }

    if (!playlists[choice]) {

        alert("Playlist not found.");

        return;

    }

    if (
        playlists[choice]
            .includes(songIndex)
    ) {

        alert(
            "This song is already in " +
            choice + "!"
        );

        return;

    }

    playlists[choice].push(songIndex);

    savePlaylists();

    showPlaylists();

}


/* =========================
   START
   ========================= */

loadSong(0);

showCards();

showSongs();

showPlaylists();

</script>
